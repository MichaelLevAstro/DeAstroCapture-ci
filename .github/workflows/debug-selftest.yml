name: debug-selftest

# Temporary: where does --selftest stop on macOS. Builds without the self-test,
# then runs it in the background and dumps its Python stack with py-spy.

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: main

permissions:
  contents: read

jobs:
  debug:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MichaelLevAstro/DeAstroCapture
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: brew install libusb
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt py-spy
      - run: python build.py --no-selftest --no-installer
      - name: Self-test with stack dumps
        shell: bash
        run: |
          exe=$(find dist -path '*Contents/MacOS/DeAstroCapture' -type f | head -1)
          echo "exe=$exe"
          "$exe" --selftest > selftest.log 2>&1 &
          pid=$!
          sleep 60
          if kill -0 $pid 2>/dev/null; then
            sudo py-spy dump --pid $pid || true
            sample $pid 3 -file sample.txt >/dev/null 2>&1 || sudo sample $pid 3 -file sample.txt >/dev/null 2>&1 || true
            echo "=== native ==="
            # threads' call trees, library frames only
            sed -n '/^Call graph:/,/^Total number in stack/p' sample.txt | grep -E "Thread_|dlopen|ImageLoader|dyld|libEAF|libtoupcam|libnncam|libogmacam|libaltaircam|libsvbony|IOKit|IOHID|dispatch_sync|_dispatch|CFRunLoop|libusb|pthread_cond|pthread_mutex|__psynch|semaphore|PyEval|take_gil" | sed 's/  */ /g' | cut -c1-160 | head -300
          else
            echo "exited"
          fi
          kill $pid 2>/dev/null || true
          echo "=== output ==="
          cat selftest.log
